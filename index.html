<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ebe9e3">
<meta name="description" content="MUSO Momentum: personal training from MUSO Fitness. Start with discovery, get a program built around you, and level up as you train.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MUSO Momentum">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>MUSO Momentum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: warm stone canvas, big soft white cards, pastel stat tiles, one sunny yellow accent with olive status pills. Navigation lives in a floating icon dock at the bottom, like a phone app. Deliberately a single light look. */
:root{
  --bg:#ebe9e3; --surface:#fbfaf7; --surface-2:#f3f2ed; --surface-3:#e4e2da;
  --line:#e2dfd7; --line-soft:#ecebe5;
  --text:#1b1a17; --dim:#57534b; --faint:#8c877d;
  --yellow:#f7b42c; --yellow-deep:#e09a0c; --yellow-soft:#fdeec9;
  --olive:#869a2f; --olive-ink:#5f6e1c; --olive-soft:#e6ebcd;
  --peach:#f3d8ce; --lav:#ddd7f7; --lav-ink:#6c5fcf; --sage:#e3e1d4; --sky:#d7e7f1; --sky-ink:#3d7aa3;
  --warn:#c9650e; --warn-soft:#fbe3cc;
  --hatch:#d9d6cd;
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:28px; --r-sm:18px;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 34px -18px rgba(70,55,30,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;
  background:radial-gradient(900px 520px at 0% -10%,#f6e3d3 0%,transparent 60%),radial-gradient(800px 500px at 100% 0%,#efe2ee 0%,transparent 55%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px;border-radius:10px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(235,233,227,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:38px;height:38px;display:block;flex:none;border-radius:50%;box-shadow:0 6px 14px -6px rgba(13,43,62,.6)}
.brand .nm{font-weight:800;font-size:17px;letter-spacing:-.4px;line-height:1.1}
.brand .sb{font-size:11.5px;color:var(--faint);font-weight:600}
.seg{display:inline-flex;background:var(--surface);border-radius:100px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:700;font-size:13px;padding:8px 16px;border-radius:100px;transition:background .15s,color .15s}
.seg button.on{background:var(--yellow);color:var(--text)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:600}
.who select{background:var(--surface);border:0;border-radius:100px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--text);max-width:180px;box-shadow:var(--shadow)}

/* floating dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;gap:6px;align-items:center;
  background:rgba(251,250,247,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:7px;border-radius:100px;box-shadow:0 18px 40px -14px rgba(60,45,20,.35),0 0 0 1px rgba(0,0,0,.03);max-width:calc(100% - 32px)}
.dock button{border:0;background:transparent;color:var(--text);height:50px;min-width:50px;padding:0 15px;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;position:relative;transition:background .2s}
.dock button svg{width:21px;height:21px;flex:none}
.dock button .lb{display:none}
.dock button.on{background:var(--yellow)}
.dock button.on .lb{display:inline}
.dock button:not(.on):hover{background:var(--surface-2)}
.dock .lockdot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--faint);border:2px solid var(--surface)}
@media (max-width:520px){.dock button.on .lb{display:none}.dock button{padding:0 13px}}
main{padding-block:14px 130px}

h1.pt{font-size:clamp(30px,5.4vw,46px);font-weight:800;letter-spacing:-1.6px;line-height:1.02;margin:10px 0 10px;text-wrap:balance;max-width:16ch}
.rule{display:none}
p.ps{color:var(--dim);margin:0 0 24px;max-width:600px;font-size:15px}
.hi{display:flex;align-items:center;gap:10px;margin-top:6px;font-weight:600;color:var(--dim)}
.hi .av{width:44px;height:44px;border-radius:50%}
.hi b{display:block;color:var(--text);font-size:16px;line-height:1.1}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:900px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.ch .mt{font-size:12.5px;color:var(--faint);font-weight:600}
.muted{color:var(--faint)} .dim{color:var(--dim)}

.btn{border:0;background:var(--surface-2);color:var(--text);font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:100px;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.pri,.btn.gold{background:var(--yellow);color:var(--text)}
.btn.pri:hover,.btn.gold:hover{background:#f3a815}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:100px;background:var(--surface-2);color:var(--dim);white-space:nowrap}
.pill.red,.pill.gold{background:var(--olive);color:#fff}
.pill.good{background:var(--olive-soft);color:var(--olive-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.blue{background:var(--lav);color:var(--lav-ink)}

.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text);background:var(--peach)}
.av.t{background:var(--lav);color:var(--lav-ink)}
.av.lg{width:76px;height:76px;font-size:25px}
.av.xs{width:30px;height:30px;font-size:11px}
.av[data-h="1"]{background:var(--lav)} .av[data-h="2"]{background:var(--sage)} .av[data-h="3"]{background:var(--sky)} .av[data-h="4"]{background:var(--yellow-soft)} .av[data-h="5"]{background:var(--olive-soft)}

/* roster */
.roster{display:flex;flex-direction:column;gap:4px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r-sm);border:0;background:transparent;text-align:left;width:100%;color:inherit}
.rrow:hover{background:var(--surface-2)}
.rrow.sel{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--yellow)}
.rn{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rs{font-size:12px;color:var(--faint);margin-top:2px;font-weight:500}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lvl{font-size:11.5px;font-weight:800;color:var(--olive-ink);background:var(--olive-soft);padding:3px 9px;border-radius:100px;font-variant-numeric:tabular-nums}
.gh{font-size:12px;font-weight:700;color:var(--faint);padding:14px 10px 4px;display:flex;justify-content:space-between;gap:8px}

/* profile */
.hero{background:var(--surface)}
.ptop{display:flex;gap:16px;align-items:center}
.pname{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.rank{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
.rank svg{width:14px;height:14px;color:var(--yellow-deep)}
.xp{margin-top:18px}
.xpbig{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.xpbig b{font-size:26px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.xpbig span{font-size:13px;color:var(--faint);font-weight:600}
.xpl{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-weight:600;margin-bottom:7px;font-variant-numeric:tabular-nums;gap:8px}
.track{height:10px;border-radius:100px;background:var(--surface-3);overflow:hidden}
.fill{height:100%;border-radius:100px;background:var(--olive);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.good{background:var(--olive)}
.fill.y{background:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{border-radius:22px;padding:14px 12px 13px;background:var(--peach);display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.stat:nth-child(2){background:var(--lav)} .stat:nth-child(3){background:var(--sage)}
.stat .si{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat .si svg{width:19px;height:19px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim);font-weight:600}
.why{margin-top:16px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r-sm);font-size:14px;color:var(--dim)}
.why b{color:var(--text);font-weight:700}

/* metrics */
.mrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) 84px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mk{font-weight:700;font-size:14px}
.mv{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:2px;font-weight:500}
.mv b{color:var(--text);font-weight:800}
.mp .xpl{margin-bottom:6px;font-size:11.5px}
.spark{width:84px;height:30px;display:block}
@media (max-width:520px){.mrow{grid-template-columns:minmax(0,1fr) 72px}.mrow .mp{grid-column:1/-1;grid-row:2}.spark{width:72px}}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:18px 8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.medal{width:56px;height:56px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:var(--yellow);color:var(--text);box-shadow:0 8px 18px -8px rgba(224,154,12,.8)}
.medal svg{width:23px;height:23px}
.bd.locked .medal{background:var(--surface-3);box-shadow:none;color:var(--faint)}
.bd.locked .medal svg{opacity:.55}
.bd .lk{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--faint);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bd .lk svg{width:10px;height:10px;opacity:1}
.bd small{font-size:11px;font-weight:700;color:var(--text);line-height:1.25}
.bd.locked small{color:var(--faint);font-weight:600}
.bd.fresh .medal{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* lists */
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.li:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--yellow-soft);color:var(--text)}
.ic svg{width:18px;height:18px}
.ic.off{background:var(--surface-2);color:var(--faint)}
.li .t{font-weight:700;font-size:14px}
.li .s{font-size:12.5px;color:var(--faint);font-weight:500}
.li .x{margin-left:auto;font-weight:800;color:var(--olive-ink);font-size:13px;flex:none;font-variant-numeric:tabular-nums}

/* forms */
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f label,.fl{font-size:12.5px;font-weight:700;color:var(--dim)}
.f .hint{font-size:12px;color:var(--faint)}
.inp{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;font-size:14px;width:100%;min-width:0;color:var(--text);font-weight:500}
.inp:focus{border-color:var(--yellow);background:var(--surface);outline:none}
textarea.inp{min-height:80px;resize:vertical;line-height:1.45}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:620px){.fg,.fg3{grid-template-columns:minmax(0,1fr)}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:0;background:var(--surface-2);color:var(--dim);border-radius:100px;padding:9px 15px;font-size:13px;font-weight:700}
.opt.on{background:var(--text);color:var(--surface)}
.goalcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.goalcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gc{border:0;border-radius:22px;padding:14px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:4px;background:var(--surface-2);transition:transform .15s}
.gc .si{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.gc svg{width:19px;height:19px}
.gc b{font-size:14px;font-weight:800}
.gc span{font-size:12px;color:var(--dim)}
.gc:nth-child(6n+1).on{background:var(--peach)} .gc:nth-child(6n+2).on{background:var(--lav)} .gc:nth-child(6n+3).on{background:var(--sage)} .gc:nth-child(6n+4).on{background:var(--sky)} .gc:nth-child(6n+5).on{background:var(--yellow-soft)} .gc:nth-child(6n+6).on{background:var(--olive-soft)}
.gc.on{box-shadow:inset 0 0 0 2px var(--text)}
.stepper{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stp{flex:1 0 auto;min-width:84px;display:flex;flex-direction:column;gap:7px;background:none;border:0;padding:0;text-align:left;color:var(--faint);font-size:12px;font-weight:700}
.stp i{display:block;height:6px;border-radius:6px;background:var(--surface-3)}
.stp.done i{background:var(--olive)} .stp.cur i{background:var(--yellow)}
.stp.cur{color:var(--text)} .stp.done{color:var(--dim)}
.qs{display:flex;flex-direction:column;gap:20px}
.formfoot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
input[type=range]{accent-color:var(--yellow-deep);width:100%}

/* plan review */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pm{background:var(--surface-2);border-radius:var(--r-sm);padding:14px}
.pm .k{font-size:12px;color:var(--faint);font-weight:700}
.pm .v{font-size:16px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pm .v em{font-style:normal;color:var(--olive-ink)}
.ms{display:flex;flex-direction:column}
.msi{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.msi:last-child{border-bottom:0}
.msi b{font-size:12.5px;font-weight:800;color:var(--olive-ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:16px;padding:10px 4px;text-align:center;font-size:11px;min-height:72px;display:flex;flex-direction:column;gap:6px;align-items:center}
.day b{font-size:11px;color:var(--faint);font-weight:700}
.day span{font-weight:700;line-height:1.2}
.day.c{background:var(--yellow)} .day.c b{color:var(--text)}
.day.k{background:var(--peach)} .day.s{background:var(--lav)}
.day.o span{color:var(--faint);font-weight:600}

/* timer */
.tmr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.tmr{grid-template-columns:minmax(0,1fr)}}
.face{position:relative;border-radius:var(--r);padding:24px 20px;text-align:center;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;transition:background .35s}
.face[data-ph=work]{background:var(--yellow-soft)}
.face[data-ph=switch]{background:var(--lav)}
.face[data-ph=rest]{background:var(--sky)}
.face[data-ph=done]{background:var(--olive-soft)}
.face.flash{animation:flash .6s ease-out}
@keyframes flash{0%{transform:scale(.985)}100%{transform:scale(1)}}
.phase{display:inline-block;font-size:12px;font-weight:800;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.75);color:var(--dim)}
.face[data-ph=work] .phase{background:var(--yellow);color:var(--text)} .face[data-ph=switch] .phase{background:var(--lav-ink);color:#fff} .face[data-ph=rest] .phase{background:var(--sky-ink);color:#fff} .face[data-ph=done] .phase{background:var(--olive);color:#fff}
.ringwrap{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:14px auto 6px;max-width:100%}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .bgc{stroke:rgba(0,0,0,.06)} .ringwrap .fgc{stroke:var(--text);transition:stroke-dashoffset .25s linear,stroke .3s}
.face[data-ph=work] .fgc{stroke:var(--yellow-deep)} .face[data-ph=switch] .fgc{stroke:var(--lav-ink)} .face[data-ph=rest] .fgc{stroke:var(--sky-ink)} .face[data-ph=done] .fgc{stroke:var(--olive)}
.tnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tnum b{font-size:clamp(54px,12vw,76px);font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1}
.tnum span{font-size:12.5px;color:var(--dim);margin-top:6px;font-weight:600;font-variant-numeric:tabular-nums}
.tlabel{font-size:clamp(22px,4vw,28px);font-weight:800;letter-spacing:-.8px;margin-top:4px;text-wrap:balance}
.tsub{color:var(--dim);font-size:14px;margin-top:4px;min-height:20px}
.ctrls{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.ctrls .btn{min-width:52px;justify-content:center;background:rgba(255,255,255,.8)}
.ctrls .btn.pri{background:var(--yellow);min-width:140px;padding:14px 22px;font-size:15px}
.face[data-ph=work] .ctrls .btn.pri{background:var(--text);color:var(--surface)}
.ovr{margin-top:18px;text-align:left}
.ovr .track{background:rgba(0,0,0,.07)}
.ovr .fill{background:var(--text)}
.stl{display:flex;flex-direction:column;gap:6px}

/* ---------- small charts ---------- */
function spark(m){
  const h=m.hist||[]; if(h.length<2) return '<svg class="spark"></svg>';
  const w=84,ht=30,p=3, mn=Math.min(...h,m.target), mx=Math.max(...h,m.target), rg=(mx-mn)||1;
  const X=i=>p+i*(w-2*p)/(h.length-1), Y=v=>ht-p-(v-mn)/rg*(ht-2*p);
  const pts=h.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const ty=Y(m.target).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><line x1="0" x2="${w}" y1="${ty}" y2="${ty}" stroke="var(--olive)" stroke-dasharray="2 3" stroke-width="1.2" opacity=".8"/><polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(h.length-1)}" cy="${Y(h[h.length-1])}" r="3.5" fill="var(--yellow)" stroke="var(--text)" stroke-width="1.2"/></svg>`;
}
function lineChart(data,label){
  if(!data.length) return `<div class="empty">No circuits logged yet. Finish one and your totals land here.</div>`;
  const rows=data.slice(-7), w=520,h=200,l=36,r=8,t=24,b=28, vals=rows.map(d=>d.t), best=Math.max(...vals);
  const mx=Math.ceil(best*1.15/50)*50, ticks=[0,mx/2,mx], slot=(w-l-r)/rows.length, bw=Math.min(44,slot*.62);
  const Y=v=>t+(1-v/mx)*(h-t-b);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">
    <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--surface-2)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--hatch)" stroke-width="3"/></pattern></defs>
    ${ticks.map(v=>`<text x="${l-10}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    ${rows.map((d,i)=>{const x=l+slot*i+(slot-bw)/2, top=Y(d.t), hb=h-b-top, isBest=d.t===best;
      return `<rect x="${x}" y="${t}" width="${bw}" height="${h-b-t}" rx="${bw/2}" fill="url(#hatch)" opacity=".7"/><rect x="${x}" y="${top}" width="${bw}" height="${hb}" rx="${bw/2}" fill="${isBest?'var(--yellow)':'var(--surface-3)'}"/>${isBest?`<text class="vl" x="${x+bw/2}" y="${top-8}" text-anchor="middle">${d.t}</text>`:''}<text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${esc(d.d)}</text>`}).join('')}
  </svg>`;
}
function pct(m){ const span=m.target-m.base; if(!span) return 100; return Math.max(0,Math.min(100,Math.round((m.cur-m.base)/span*100))); }

/* ---------- timer engine ---------- */
const TM={kind:null,seq:[],i:0,running:false,end:0,left:0,done:false,wl:null,timerId:null,lastBeep:null};
function circuitSeq(){ const c=S.circuit, q=[{type:'ready',label:'Get set',sub:'First station: '+c.stations[0].name,dur:10,st:0,r:1}];
  for(let r=1;r<=c.rounds;r++){ c.stations.forEach((s,i)=>{ q.push({type:'work',label:s.name,sub:s.cue,dur:c.work,st:i,r}); if(i<c.stations.length-1) q.push({type:'switch',label:'Switch',sub:'Move to '+c.stations[i+1].name,dur:c.transition,st:i+1,r}); });
    if(r<c.rounds&&c.roundRest>0) q.push({type:'rest',label:'Round rest',sub:'Round '+(r+1)+' starts at '+c.stations[0].name,dur:c.roundRest,st:0,r:r+1}); }
  return q; }
function stretchSeq(){ const s=S.stretch, q=[{type:'ready',label:'Get set',sub:'First up: '+s.items[0].name,dur:8,st:0}];
  s.items.forEach((x,i)=>{ if(x.sides){ q.push({type:'work',label:x.name+' · left',sub:x.cue,dur:x.hold,st:i}); q.push({type:'switch',label:'Switch sides',sub:'Same stretch, right side',dur:5,st:i}); q.push({type:'work',label:x.name+' · right',sub:x.cue,dur:x.hold,st:i}); } else q.push({type:'work',label:x.name,sub:x.cue,dur:x.hold,st:i});
    if(i<s.items.length-1) q.push({type:'switch',label:'Next stretch',sub:'Get into '+s.items[i+1].name,dur:s.transition,st:i+1}); });
  return q; }
function tmLoad(kind){ tmStop(); TM.kind=kind; TM.seq=kind==='circuit'?circuitSeq():stretchSeq(); TM.i=0; TM.left=TM.seq[0].dur*1000; TM.done=false; TM.running=false; }
function tmStart(){ audio(); if(TM.done) return; TM.running=true; TM.end=Date.now()+TM.left; clearInterval(TM.timerId); TM.timerId=setInterval(tmTick,100);
  try{ if(navigator.wakeLock&&!TM.wl) navigator.wakeLock.request('screen').then(w=>{TM.wl=w}).catch(()=>{}); }catch(e){} beep(660,.1); paintTimer(); }
function tmPause(){ TM.running=false; TM.left=Math.max(0,TM.end-Date.now()); clearInterval(TM.timerId); paintTimer(); }
function tmStop(){ clearInterval(TM.timerId); TM.running=false; try{TM.wl&&TM.wl.release()}catch(e){} TM.wl=null; }
function tmNext(){ TM.i++; TM.lastBeep=null; if(TM.i>=TM.seq.length){ TM.done=true; tmStop(); TM.left=0; beep(988,.18); setTimeout(()=>beep(1318,.3),200); onFinish(); return; }
  const s=TM.seq[TM.i]; TM.left=s.dur*1000; TM.end=Date.now()+TM.left;
  if(s.type==='switch'){beep(1046,.12);setTimeout(()=>beep(1046,.12),180);} else if(s.type==='work') beep(784,.25); else beep(523,.2);
  const f=$('tm-face'); if(f){f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash');} }
function tmTick(){ if(!TM.running) return; const rem=TM.end-Date.now(); TM.left=rem; const sec=Math.ceil(rem/1000);
  if(sec<=3&&sec>=1&&TM.lastBeep!==sec){ TM.lastBeep=sec; beep(440,.08,.12); }
  if(rem<=0) tmNext(); paintTimer(); }
function tmSkip(){ audio(); const run=TM.running; if(TM.done) return; tmNext(); if(!run&&!TM.done){TM.left=TM.seq[TM.i].dur*1000;} paintTimer(); }
function tmReset(){ const k=TM.kind; tmLoad(k); render(); }
function paintTimer(){
  const f=$('tm-face'); if(!f||!TM.seq.length) return;
  const s=TM.done?{type:'done',label:'Session complete',sub:TM.kind==='circuit'?'Log your numbers below':'Nice work. Your body thanks you.',dur:1}:TM.seq[TM.i];
  const secLeft=TM.done?0:Math.ceil(TM.left/1000), frac=TM.done?1:1-TM.left/(s.dur*1000);
  f.dataset.ph=s.type;
  $('tm-phase').textContent={ready:'Get ready',work:TM.kind==='circuit'?'Work':'Hold',switch:TM.kind==='circuit'?'Switch station':'Transition',rest:'Rest',done:'Done'}[s.type];
  $('tm-time').textContent=mmss(secLeft);
  $('tm-label').textContent=s.label; $('tm-sub').textContent=s.sub||'';
  const C=2*Math.PI*54; $('tm-ring').style.strokeDashoffset=(C*(1-Math.min(1,frac))).toFixed(1);
  const totalMs=TM.seq.reduce((a,x)=>a+x.dur,0), doneMs=TM.done?totalMs:TM.seq.slice(0,TM.i).reduce((a,x)=>a+x.dur,0)+(s.dur-TM.left/1000);
  $('tm-ov').style.width=Math.min(100,doneMs/totalMs*100).toFixed(1)+'%';
  $('tm-ovl').textContent=`${mmss(totalMs-doneMs)} left`;
  $('tm-meta').textContent=TM.kind==='circuit'?(TM.done?`${S.circuit.rounds} rounds done`:`Round ${s.r} of ${S.circuit.rounds}`):(TM.done?`${S.stretch.items.length} stretches done`:`Stretch ${s.st+1} of ${S.stretch.items.length}`);
  const pb=$('tm-play'); if(pb){ pb.innerHTML=TM.running?ic('pause')+' Pause':ic('play')+(TM.i>0||TM.left<s.dur*1000?' Resume':' Start'); pb.disabled=TM.done; }
  document.querySelectorAll('[data-sti-row]').forEach(el=>{ const i=+el.dataset.stiRow; el.classList.remove('now','nx','dn');
    if(TM.done){el.classList.add('dn');return;}
    if(s.type==='work'&&i===s.st) el.classList.add('now'); else if((s.type==='switch'||s.type==='rest'||s.type==='ready')&&i===s.st) el.classList.add('nx'); else if(i<s.st) el.classList.add('dn'); });
  const lg=$('tm-log'); if(lg) lg.hidden=!TM.done;
}

    <div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="54" fill="none" stroke-width="7"/><circle class="fgc" id="tm-ring" cx="60" cy="60" r="54" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
      <div class="tnum"><b id="tm-time">0:10</b><span id="tm-meta"></span></div></div>
    <div class="tlabel" id="tm-label"></div><div class="tsub" id="tm-sub"></div>
    <div class="ctrls"><button class="btn" data-tm="reset" aria-label="Restart">${ic('reset')}</button><button class="btn pri" id="tm-play" data-tm="play">${ic('play')} Start</button><button class="btn" data-tm="skip" aria-label="Skip">${ic('skip')} Skip</button></div>

    <div class="col">
      <div class="card"><div class="ch"><h2>Stations</h2><span class="mt">Set by your trainer</span></div>
        <div class="stl">${c.stations.map((s,i)=>`<div class="st" data-sti-row="${i}"><span class="n">${i+1}</span><div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="cu">${esc(s.cue)}</div></div><span class="pill">${s.unit}</span></div>`).join('')}</div>
        <div class="cfg"><div><b>${c.work}s</b><span>Work</span></div><div><b>${c.transition}s</b><span>Switch</span></div><div><b>${c.rounds}</b><span>Rounds</span></div><div><b>${c.roundRest}s</b><span>Rest</span></div></div></div>
      <div class="card"><div class="ch"><h2>Your circuit totals</h2><span class="mt">Best is gold</span></div>${lineChart(cl.circ,'Circuit totals over time')}</div>
    </div></div>`;
}
function cStretch(){
  if(TM.kind!=='stretch') tmLoad('stretch');
  const s=S.stretch, cl=S.clients[S.me];
  return `<h1 class="pt">${esc(s.name)}</h1><div class="rule"></div><p class="ps">A guided stretch you can run daily. Hold until the beep. Two-sided stretches cue you to switch.</p>
  <div class="tmr">
    <div class="col">${timerFace()}
      <div class="card" id="tm-log" hidden><div class="ch"><h2>Finish up</h2><span class="mt">+60 XP</span></div>
        <div class="fg"><div class="f"><label for="lg-reach">Sit and reach today (in, optional)</label><input class="inp" type="number" step="0.5" id="lg-reach" placeholder="${(cl.metrics.find(m=>m.k==='reach')||{}).cur??'0'}"></div><div class="f"><span class="fl">How do you feel?</span><div class="opts" id="feel">${['Tight','Better','Loose'].map(x=>`<button type="button" class="opt" data-feel="${x}">${x}</button>`).join('')}</div></div></div>
        <div class="row" style="margin-top:14px"><button class="btn pri" data-savestretch="1">${ic('check')} Log stretch</button></div></div>
    </div>
    <div class="col">
      <div class="card"><div class="ch"><h2>Routine</h2><span class="mt">${s.items.length} stretches</span></div>
        <div class="stl">${s.items.map((x,i)=>`<div class="st" data-sti-row="${i}"><span class="n">${i+1}</span><div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="cu">${esc(x.cue)}</div></div><span class="pill${x.sides?' blue':''}">${x.hold}s${x.sides?' × 2':''}</span></div>`).join('')}</div></div>
      <div class="card"><div class="ch"><h2>Stretch streak</h2></div><div class="stats" style="margin-top:0"><div class="stat"><div class="si">${ic('wave')}</div><b>${cl.stretchN}</b><span>Sessions</span></div><div class="stat"><div class="si">${ic('star')}</div><b>${Math.max(0,5-cl.stretchN)||'Done'}</b><span>To Reset Ritual</span></div><div class="stat"><div class="si">${ic('stretch')}</div><b>${Math.max(0,20-cl.stretchN)||'Done'}</b><span>To Rubber Band</span></div></div></div>
    </div></div>`;
}
function onFinish(){ paintTimer(); const lg=$('tm-log'); if(lg){ lg.hidden=false; lg.scrollIntoView({behavior:'smooth',block:'nearest'}); } }
function today(){ return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function cProgress(){
  const c=S.clients[S.me];
  return `<h1 class="pt">Progress</h1><div class="rule"></div><p class="ps">Where you started, where you are, and where you are headed. Targets come from your discovery intake and update with your trainer.</p>
  <div class="grid"><div class="col">${metricsCard(c,false)}<div class="card"><div class="ch"><h2>Circuit totals</h2></div>${lineChart(c.circ,'Circuit totals over time')}</div></div>
  <div class="col"><div class="card"><div class="ch"><h2>Milestones</h2></div><div class="ms">${genPlan({zones:c.disc.zones||[],days:c.disc.days||3,goal:c.goal,second:c.second,win:c.disc.win,pushups:'',plank:'',reach:'',mile:'',weight:'',rhr:''}).miles.map((x,i)=>`<div class="msi"><b>${x.w}</b><span>${esc(x.t)} ${i===0&&c.badges.includes('mile')?'<span class="pill good">Done</span>':''}</span></div>`).join('')}</div></div>
  <div class="card"><div class="ch"><h2>Level path</h2></div>${RANKS.map(r=>{const l=lvlOf(c.xp),on=l>=r.min;return `<div class="li" style="align-items:center"><div class="ic${on?'':' off'}">${ic('bolt')}</div><div style="flex:1"><div class="t">${r.n}</div><div class="s">Level ${r.min}+ · ${xpFor(r.min).toLocaleString()} XP</div></div>${on?'<span class="pill gold">Reached</span>':''}</div>`}).join('')}</div></div></div>`;
}
function cBoard(){
  const c=S.clients[S.me];
  if(!S.lb.enabled) return `<h1 class="pt">Leaderboard</h1><div class="rule"></div><div class="card lockbox" style="max-width:620px"><div class="bigic">${ic('lock')}</div><h3>Not switched on yet</h3><p>Your trainer will turn this on when the time is right. You will get to choose whether to join before anything is shown.</p></div>`;
  if(c.consent==null) return `<h1 class="pt">Leaderboard</h1><div class="rule"></div><div style="max-width:720px">${consentCard(c)}</div>`;
  if(c.consent===false) return `<h1 class="pt">Leaderboard</h1><div class="rule"></div><div class="card lockbox" style="max-width:620px"><div class="bigic">${ic('lock')}</div><h3>You opted out</h3><p>Your progress stays private. You can change your mind any time.</p><div style="margin-top:14px"><button class="btn gold" data-consent="1">Join the leaderboard</button></div></div>`;
  return `<h1 class="pt">Leaderboard</h1><div class="rule"></div><p class="ps">Only clients who opted in are shown. <button class="btn sm ghost" data-consent="0" style="margin-left:6px">Leave the board</button></p><div style="max-width:720px">${boardList(Object.values(S.clients).filter(x=>x.consent===true),c.id)}</div>`;
}

/* ---------- events ---------- */
function bind(){ /* delegated below */ }
function toggleZone(id){ const d=S.disc.data; if(!d) return; const i=d.zones.findIndex(z=>z.z===id); if(i>=0) d.zones.splice(i,1); else d.zones.push({z:id,i:defaultIntent(d.goal)}); render(); }
$('view').addEventListener('keydown',e=>{ const g=e.target.closest&&e.target.closest('.zg'); if(!g||(e.key!=='Enter'&&e.key!==' ')) return; e.preventDefault(); const id=g.dataset.zone, inBack=!!g.closest('figure:last-child'); toggleZone(id); const figs=document.querySelectorAll('.bmap figure'); const f=figs[inBack?1:0]; const el=f&&f.querySelector(`.zg[data-zone="${id}"]`); if(el) el.focus(); });
$('view').addEventListener('click',e=>{
  const zg=e.target.closest&&e.target.closest('.zg'); if(zg){ toggleZone(zg.dataset.zone); return; }
  const t=e.target.closest('button'); if(!t) return; const ds=t.dataset;
  if(ds.ztog){ toggleZone(ds.ztog); return; }
  if(ds.zrm){ const d=S.disc.data; d.zones=d.zones.filter(z=>z.z!==ds.zrm); render(); return; }
  if(ds.zint){ const z=S.disc.data.zones.find(x=>x.z===ds.zint); if(z) z.i=ds.v; render(); return; }
  if(ds.fig){ S.disc.data.figure=ds.fig; render(); return; }
  if(ds.sel){ S.sel=ds.sel; render(); return; }
  if(ds.start){ S.started=true; S.disc={step:0,data:null}; render(); window.scrollTo({top:0}); return; }
  if(ds.roleSwitch){ S.role=ds.roleSwitch; render(); return; }
  if(ds.reset){ if(t.dataset.armed){ try{localStorage.removeItem('muso-momentum')}catch(err){} location.reload(); } else { t.dataset.armed='1'; t.textContent='Tap again to erase everything'; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent='Reset test data'; } },4000); } return; }
  if(ds.newclient){ S.onboarded=false; S.started=false; S.disc={step:0,data:null}; render(); window.scrollTo({top:0}); return; }
  if(ds.rall!=null){ S.rosterAll=ds.rall==='1'; render(); return; }
  if(ds.go){ S.ttab=ds.go; saveUI(); render(); return; }
  if(ds.ctab){ S.ctab=ds.ctab; saveUI(); render(); window.scrollTo({top:0}); return; }
  if(ds.rmt){ const c=S.clients[S.sel]; c.trainers=c.trainers.filter(x=>x!==ds.rmt); toast(`${S.trainers[ds.rmt].name} removed`); render(); return; }
  if(ds.addt){ const c=S.clients[S.sel], id=$('addt').value; c.trainers.push(id); toast(`${S.trainers[id].name} now co-trains ${c.name.split(' ')[0]}`); render(); return; }
  if(ds.award){ const c=S.clients[S.sel]; c.awards.unshift({n:$('aw-n').value,by:S.trainerId,note:$('aw-note').value.trim(),d:today()}); gainXP(c,100,`${$('aw-n').value} for ${c.name.split(' ')[0]}`); render(); return; }
  if(ds.logm!=null){ const c=S.clients[S.sel], m=c.metrics[+ds.logm], raw=$('mu-'+ds.logm).value.trim(); if(!raw) return;
    const v=m.unit==='time'?parseTime(raw):+raw; if(v==null||isNaN(v)){toast('Enter a number'+(m.unit==='time'?' like 10:45':''));return;}
    const better=m.dir>0?v>m.cur:v<m.cur; m.cur=v; m.hist.push(v);
    if(better) gainXP(c,50,`New ${m.label.toLowerCase()} for ${c.name.split(' ')[0]}`); else toast(`${m.label} logged`);
    if(pct(m)>=100) award(c,'crush'); render(); return; }
  /* discovery */
  const d=S.disc.data;
  if(ds.opt){ const k=ds.opt, v=isNaN(+ds.v)||k==='age'||k==='sleep'?ds.v:+ds.v; if(ds.multi==='1'){ const a=d[k]; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1);} else d[k]=v; render(); return; }
  if(ds.tr){ const i=d.trainers.indexOf(ds.tr); i<0?d.trainers.push(ds.tr):d.trainers.splice(i,1); render(); return; }
  if(ds.goal){ d.goal=ds.goal; d.second=d.second.filter(x=>x!==ds.goal); render(); return; }
  if(ds.sec){ const i=d.second.indexOf(ds.sec); i<0?d.second.push(ds.sec):d.second.splice(i,1); render(); return; }
  if(ds.dstep){ S.disc.step=Math.max(0,Math.min(STEPS.length-1,S.disc.step+ +ds.dstep)); S.disc.max=Math.max(S.disc.max||0,S.disc.step); render(); window.scrollTo({top:0}); return; }
  if(ds.step!=null){ const to=+ds.step; let ok=true; for(let i=0;i<to;i++) if(!stepOk(d,i)) ok=false; if(ok||to<S.disc.step){S.disc.step=to; render(); window.scrollTo({top:0});} else toast('Finish the earlier steps first'); return; }
  if(ds.sample){ S.disc.data=sampleDisc(); S.disc.data.trainers=[S.trainerId]; S.disc.max=5; render(); toast('Sample answers loaded'); return; }
  if(ds.create){ createFromDisc(); return; }
  if(ds.pq!=null){ d.parq[+ds.pq]=ds.v; render(); return; }
  if(ds.copy!=null){ const v=ds.copy; try{ navigator.clipboard.writeText(v).then(()=>toast('Copied '+v),()=>toast(v)); }catch(err){ toast(v); } return; }
  /* programs */
  if(ds.addst){ S.circuit.stations.push({name:'New station',cue:'Add a coaching cue',unit:'reps'}); render(); return; }
  if(ds.rmst!=null){ S.circuit.stations.splice(+ds.rmst,1); TM.kind=null; render(); return; }
  /* leaderboard */
  if(ds.lbt){ S.lb.enabled=!S.lb.enabled; toast(S.lb.enabled?'Leaderboard on. Opt-in requests sent':'Leaderboard off'); if(S.lb.enabled){ /* a couple of example answers so the board has life */ ['c1','c3','c6'].forEach(id=>{ if(S.clients[id]&&S.clients[id].consent==null&&id!==S.me) S.clients[id].consent=true; }); } render(); return; }
  if(ds.lbm){ S.lb.metric=ds.lbm; render(); return; }
  if(ds.consent!=null){ const c=S.clients[S.me]; c.consent=ds.consent==='1'; toast(c.consent?'You are on the leaderboard':'Got it. You stay private'); render(); return; }
  /* timer */
  if(ds.tm==='play'){ TM.running?tmPause():tmStart(); return; }
  if(ds.tm==='skip'){ tmSkip(); return; }
  if(ds.tm==='reset'){ tmReset(); return; }
  if(ds.feel){ document.querySelectorAll('[data-feel]').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(ds.savecirc){ const c=S.clients[S.me], reps={}; let tot=0, all=true;
    S.circuit.stations.forEach((s,i)=>{ const v=+($('lg-'+i).value||0); reps[s.name]=v; tot+=v; if(!v) all=false; });
    if(!tot){ toast('Add at least one station number'); return; }
    const best=c.circ.length?Math.max(...c.circ.map(x=>x.t)):0;
    c.circ.push({d:today(),t:tot}); c.sessions++;
    award(c,'circ1'); if(all) award(c,'full'); if(best&&tot>best) award(c,'pr'); if(c.sessions>=50) award(c,'fifty');
    gainXP(c,150+(best&&tot>best?50:0),best&&tot>best?'Circuit done, new high':'Circuit complete');
    tmLoad('circuit'); render(); return; }
  if(ds.savestretch){ const c=S.clients[S.me]; c.stretchN++; c.sessions++;
    const r=$('lg-reach').value.trim(), m=c.metrics.find(x=>x.k==='reach');
    if(r!==''&&m){ const v=+r; if(!isNaN(v)){ m.cur=v; m.hist.push(v); if(pct(m)>=100) award(c,'crush'); } }
    if(c.stretchN>=5) award(c,'reset5'); if(c.stretchN>=20) award(c,'reset20');
    gainXP(c,60,'Daily Reset complete'); tmLoad('stretch'); render(); return; }
});
$('view').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.dk){ const d=S.disc.data; d[t.dataset.dk]=t.type==='range'?+t.value:t.value; if(t.id==='d-stress') $('stress-v').textContent=t.value;
    if(t.id==='d-dob'){ const a=ageOf(t.value), h=$('age-hint'); if(h) h.textContent=a?`Age ${a}`:'Used to set heart-rate zones'; }
    const nb=$('next-btn'); if(nb){ const ok=stepOk(d,S.disc.step); nb.disabled=!ok; const w=$('next-why'); if(w) w.hidden=ok; } return; }
  if(t.dataset.pg){ const v=+t.value; if(!isNaN(v)&&v>=+t.min){ S[t.dataset.pg][t.dataset.pk]=v; TM.kind=null; } return; }
  if(t.dataset.stn!=null){ S.circuit.stations[+t.dataset.stn][t.dataset.sk]=t.value; TM.kind=null; return; }
  if(t.dataset.sti!=null){ const v=+t.value; if(v>=5) { S.stretch.items[+t.dataset.sti].hold=v; TM.kind=null; } return; }
});
$('view').addEventListener('change',e=>{ const t=e.target; if(t.dataset.pg||t.dataset.sti!=null||(t.dataset.stn!=null&&t.tagName==='SELECT')||t.id==='d-group') render(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&TM.running) tmTick(); });

render();
</script>

</body>
</html>
